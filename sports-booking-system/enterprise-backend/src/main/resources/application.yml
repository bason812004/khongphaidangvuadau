server:
  port: 8088
  servlet:
    context-path: /api

spring:
  application:
    name: sports-booking-enterprise

  # Database DataSource - Defaults to In-Memory H2 for instant run without Docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:sports_booking_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # H2 Console for Database Inspection (http://localhost:8088/api/h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  # JPA & Hibernate
  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Redis Cache
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # Kafka (auto-startup: false allows running smoothly when Kafka Docker is not up)
  kafka:
    listener:
      auto-startup: false
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: sports-enterprise-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # Mail Service
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:admin@sportsbooking.com}
    password: ${MAIL_PASSWORD:secret}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# MyBatis Configuration
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sportsbooking.enterprise.model
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

camunda:
  bpm:
    history-level: full
    admin-user:
      id: admin
      password: adminpassword
      first-name: Admin
      last-name: System
      email: admin@sportsbooking.com
    auto-deployment-enabled: true

# Keycloak & JWT Security Configuration
security:
  jwt:
    secret-key: ${JWT_SECRET:EnterpriseSecretKeySportsBookingSystem2026SecureLongKey123456}
    expiration-time: 86400000 # 24 hours
  keycloak:
    auth-server-url: ${KEYCLOAK_URL:http://localhost:8080}
    realm: sports-booking
    resource: sports-admin-portal
    credentials:
      secret: ${KEYCLOAK_CLIENT_SECRET:your-client-secret}

# Custom Enterprise Application Properties
enterprise:
  reports:
    template-path: classpath:reports/
    output-dir: ./reports-output
