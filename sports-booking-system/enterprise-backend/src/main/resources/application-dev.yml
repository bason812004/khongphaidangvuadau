# application-dev.yml - Profile chạy thử nghiệm tức thì với H2 Database (không cần cài PostgreSQL)
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:sports_booking_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  # Tắt bắt buộc Kafka/Redis ở chế độ standalone dev nếu chưa bật server
  kafka:
    listener:
      auto-startup: false
